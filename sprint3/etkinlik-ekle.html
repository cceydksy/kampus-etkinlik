<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Ekle | Kampüs Etkinlikleri</title>
  <link rel="stylesheet" href="css/2221032047.css">
  <script type="module" src="js/event-form.js"></script>
</head>
<body>
  <header>
    <p class="site-adi">Kampüs Etkinlikleri</p>
    <nav>
      <a href="index.html">Ana Sayfa</a>
      <a href="etkinlikler.html">Etkinlikler</a>
      <a href="etkinlik-ekle.html" aria-current="page">Ekle</a>
    </nav>
  </header>

  <main>
    <h1>Etkinlik Ekle</h1>
    <p class="form-notu">Yıldızlı (*) alanlar zorunludur. Bu sprintte form veri kaydetmez; sonuç aşağıda gösterilir.</p>

    <form id="etkinlik-formu" novalidate>
      <div class="alan">
        <label for="ad">Etkinlik Adı *</label>
        <input type="text" id="ad" name="ad" placeholder="Örn. Kariyer Günleri">
        <span class="hata-metni" id="ad-hata"></span>
      </div>
      <div class="alan">
        <label for="kategori">Kategori *</label>
        <select id="kategori" name="kategori">
          <option value="">Seçiniz</option>
        </select>
        <span class="hata-metni" id="kategori-hata"></span>
      </div>
      <div class="alan">
        <label for="tarih">Tarih *</label>
        <input type="date" id="tarih" name="tarih">
        <span class="hata-metni" id="tarih-hata"></span>
      </div>
      <div class="alan">
        <label for="saat">Saat *</label>
        <input type="time" id="saat" name="saat">
        <span class="hata-metni" id="saat-hata"></span>
      </div>
      <div class="alan">
        <label for="yer">Yer *</label>
        <input type="text" id="yer" name="yer" placeholder="Örn. A Blok Konferans Salonu">
        <span class="hata-metni" id="yer-hata"></span>
      </div>
      <div class="alan">
        <label for="kontenjan">Kontenjan</label>
        <input type="number" id="kontenjan" name="kontenjan" min="1" max="1000">
        <span class="hata-metni" id="kontenjan-hata"></span>
      </div>
      <div class="alan">
        <label for="aciklama">Açıklama</label>
        <textarea id="aciklama" name="aciklama" rows="5"></textarea>
        <span class="hata-metni" id="aciklama-hata"></span>
      </div>
      <button type="submit">Kaydet</button>
    </form>

    <div id="form-mesaj"></div>
  </main>

  <footer>
    <p>Ceyda Nur Aksoy · 2221032047 · 2026</p>
  </footer>
</body>
</html>
